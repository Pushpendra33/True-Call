[package]
name = "truecall-core"
version = "0.1.0"
edition = "2021"
description = "Core cryptographic engine for TrueCall: Deepfake-proof approval on Passport Prime"

[dependencies]
k256 = { version = "0.13", features = ["schnorr", "sha256", "arithmetic"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chacha20poly1305 = "0.10"
getrandom = "0.2"

[[bin]]
name = "truecall-sim"
path = "src/bin/truecall-sim.rs"

